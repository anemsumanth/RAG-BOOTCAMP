<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>Local RAG Agent</title>
  <style>
    body { font-family: Arial; margin: 40px; background: #f7f7f7; }
    #chat { max-width: 600px; margin: auto; background: white; padding: 20px; border-radius: 12px; box-shadow: 0 0 10px #ccc; }
    textarea { width: 100%; height: 100px; }
    button { padding: 10px 20px; margin-top: 10px; }
    .msg { margin: 10px 0; }
    .user { color: blue; }
    .bot { color: green; }
  </style>
</head>
<body>
  <div id="chat">
    <h2>🧠 Local RAG Agent</h2>
    <div id="messages"></div>
    <textarea id="input" placeholder="Ask your question..."></textarea><br/>
    <button onclick="send()">Send</button>
  </div>

  <script>
    async function send() {
      const q = document.getElementById("input").value.trim();
      if (!q) return;
      document.getElementById("messages").innerHTML += `<div class='msg user'><b>You:</b> ${q}</div>`;
      document.getElementById("input").value = "";

      const resp = await fetch("http://127.0.0.1:8000/query", {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify({ question: q }),
      });
      const data = await resp.json();
      document.getElementById("messages").innerHTML += `<div class='msg bot'><b>Agent:</b> ${data.answer}</div>`;
    }
  </script>
</body>
</html>
